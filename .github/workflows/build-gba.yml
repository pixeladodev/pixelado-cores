name: build-gba

on:
  push:
    branches: [main]
    paths: ['gba/**', 'retro/**', 'common/**', '!**/*.md', 'NOTICE', 'LICENSE', '.github/workflows/build-gba.yml']
    tags: ['gba-v*']
  pull_request:
    paths: ['gba/**', 'retro/**', 'common/**', '!**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build (the binary must match binary_sha in gba/manifest)
        run: gba/build/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pixelado-core-gba-${{ github.run_number }}
          path: |
            gba/dist/pixelado-core-gba-*.zip
            gba/dist/SHA256SUMS
          if-no-files-found: error

  test:
    # the tests run in an arm64 container: gpSP's arm64 recompiler as on the handhelds, two cores linked over TCP
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: common, retro (fake core), gpSP's link with the test ROM
        run: gba/tests/run.sh
